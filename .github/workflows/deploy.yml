name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Pull, build, restart
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: "22"
          command_timeout: 20m
          script_stop: true
          script: |
            set -euo pipefail
            export HOME=/var/www/alkady_dev_usr/data
            export PM2_HOME="${HOME}/.pm2"
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${HOME}/bin:${HOME}/.local/bin"
            cd /var/www/alkady_dev_usr/data/www/alkady.dev

            echo "Fetching origin/main"
            git fetch origin
            git reset --hard origin/main

            echo "Installing dependencies"
            npm ci

            echo "Building"
            npm run build

            echo "Restarting alkady.dev"
            pm2 restart alkady.dev --update-env
            pm2 save

            echo "Deployed $(git log -1 --oneline)"
