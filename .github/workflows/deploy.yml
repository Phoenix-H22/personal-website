# Production CD for alkady.dev (FASTPANEL Node site on the Hostinger server).
# A push to main asks the server to deploy: the per-repo key only runs `site-deploy-gate personal-website`
# there (forced command). site-deploy fast-forwards the checkout, runs npm ci/build when needed, reloads the
# FASTPANEL pm2 app and fails the run unless https://alkady.dev/ answers 200.
name: Deploy production

on:
  push:
    branches: [main]
    paths-ignore: ['.github/**', 'docs/**']
  workflow_dispatch:
    inputs:
      dry_run: { description: Only show what would be deployed, type: boolean, default: false }

concurrency: { group: production-deploy, cancel-in-progress: false }

permissions: { contents: read }

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Deploy ${{ github.ref_name }}
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          BRANCH: ${{ github.ref_name }}
          MODE: ${{ inputs.dry_run && 'dry-run' || '' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 "deployer@$DEPLOY_HOST" "$BRANCH $MODE"
